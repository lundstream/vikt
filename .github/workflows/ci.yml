# Lint, typecheck and the whole test suite, on every push and pull request.
#
# This exists because STATE.md said "lint and typecheck clean" for a pass in
# which `HEAD` had 27 lint errors. The claim was written by hand and nothing
# checked it. From here on the verification line in STATE.md cites a run of this
# workflow instead, because a green check is a fact and a sentence is a memory.
#
# Postgres is a service container rather than a mock: the API tests run against
# a real database by design (see `apps/api/test/database.ts`), since the things
# most likely to be wrong are the `ON CONFLICT` clauses, the unique indexes and
# the cascades, and none of those exist in a fake. The harness creates and
# migrates `vikt_test` itself, so nothing here needs to run migrations.
#
# A real S3 server runs beside it for the same reason, and for a sharper one
# (D133). The SMB destination it replaces shipped with eleven tests that all
# connected to `127.0.0.1` and were refused at TCP, so not one of them ever
# reached authentication: the path that broke in production was the path nothing
# had run. The server signs requests the way S3 does, so a wrong secret here is
# a real signature failure rather than a mock returning a string somebody typed.
# It was MinIO until MinIO's images stopped being pullable; it is Versity's S3
# gateway now (D188).
#
# `pnpm --filter api contract:food` is deliberately absent. It hits the live
# Open Food Facts and Livsmedelsverket APIs, and a build that fails because
# somebody else's server is down is a build that teaches people to ignore red.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A new push to the same branch cancels the run it superseded. The old result
# is about code nobody is looking at any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # Pinned by digest, not by tag (D138). A tag is a name somebody else
        # can repoint, and this file lost two images to that in one week.
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: vikt
          POSTGRES_PASSWORD: vikt
          POSTGRES_DB: vikt
        ports:
          - 5432:5432
        # Without this the first test connects before Postgres is listening and
        # the whole job fails on something that is only a race.
        options: >-
          --health-cmd "pg_isready -U vikt -d vikt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # The harness swaps the database name for `vikt_test`, so this is the
      # credential source rather than the database actually used.
      DATABASE_URL: postgres://vikt:vikt@127.0.0.1:5432/vikt

      # Selects the live S3 tests (D133). Without it they skip, loudly, rather
      # than passing while testing nothing. The bucket is created by the tests.
      S3_TEST_ENDPOINT: http://127.0.0.1:9000
      S3_TEST_ACCESS_KEY: viktaccess
      S3_TEST_SECRET_KEY: viktsecret123
      S3_TEST_BUCKET: vikt-test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Read from `packageManager` in package.json, so the version cannot
          # drift from the one used locally.
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # `--frozen-lockfile` so a lockfile that disagrees with package.json
      # fails here rather than silently resolving to something else.
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The S3 run tests shell out to `pg_dump`, and they skip when it is
      # absent. Asserted here rather than assumed, so a runner image that drops
      # the client turns into a loud failure instead of two tests quietly
      # ceasing to run — which is the exact shape of the bug this pass fixes.
      - name: Ensure pg_dump is present
        run: pg_dump --version

      # The S3 destination's test endpoint (D133), with **default settings**: a
      # suite that only passes against a server somebody loosened is the mistake
      # this whole arrangement exists to correct.
      #
      # A step rather than a service container, because the image needs the
      # `server /data` argument and the `services:` block has nowhere to put a
      # command. Bitnami's image exists to work around exactly that and has
      # since withdrawn its `latest` tag, which is how this was found.
      #
      # **Versity's S3 gateway, not MinIO (D188).** Three MinIO images have
      # disappeared from under this one step: Bitnami withdrew its tag,
      # `minio/minio` on Docker Hub began answering `pull access denied`, and on
      # 2026-09-26 quay.io began answering 401 to the digest pinned here, which
      # failed every run on `dev` before a test had started. MinIO no longer
      # publishes images anyone can pull. `versity/versitygw` is an
      # Apache-licensed S3 gateway over a plain directory, signs with SigV4 and
      # refuses a wrong secret with a real `SignatureDoesNotMatch`; it was
      # pulled by digest, started and run against `backup-s3-live.test.ts` on a
      # workstation before this was pushed. It listens on 7070, mapped to the
      # 9000 the tests have always used, and has a health endpoint of its own.
      - name: Start the S3 test server
        run: |
          docker run -d --name vikt-s3 \
            -p 9000:7070 \
            -e ROOT_ACCESS_KEY=viktaccess \
            -e ROOT_SECRET_KEY=viktsecret123 \
            versity/versitygw:latest@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499 \
            --health /health posix /tmp
          # Waited for rather than slept past: a fixed sleep is a race that
          # passes on a fast runner and fails on a slow one.
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/health > /dev/null; then
              echo "The S3 test server is ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "The S3 test server did not become ready"
          docker logs vikt-s3
          exit 1

      - name: Test
        run: pnpm test

      # A skipped test is not a failing test, which is the whole problem: it is
      # silence, and this project has been caught by silence twice. STATE.md
      # claimed "none skipped" for weeks on the strength of somebody reading a
      # log; this reads the run. Only `backup-s3-live.test.ts` may skip, and
      # only where `S3_TEST_ENDPOINT` is unset — which it is not, here, so even
      # that one has to have run.
      - name: No skipped tests
        run: pnpm test:skips

      # Runs last because it needs the build. It fails if `__PLACEHOLDER__`
      # survives into `dist/` anywhere it is not meant to.
      - name: Build
        run: pnpm build

      - name: Check the build for unsubstituted placeholders
        run: pnpm --filter web check:placeholders

      # What the landing page costs a stranger (D173). Measured on the build
      # rather than asserted in a unit test, because the question is what
      # crosses the network and only the build knows that.
      - name: Check the landing page's budget
        run: pnpm --filter web check:bundle
