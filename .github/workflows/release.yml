# Builds the two production images and pushes them to GHCR.
#
# Why images rather than a Portainer stack that builds from git: building needs
# the whole source tree and a pnpm install on the Docker host, which turns a
# redeploy into several minutes of CPU on a box that is meant to be running
# things, not compiling them. A tagged image is pulled in seconds, and a
# rollback is the previous tag rather than a git checkout.
#
# The images are public once the repository is, so Portainer needs no registry
# credentials at all. While it is private they are private too, and the stack
# needs a pull secret configured in whatever is pulling them.
name: release

on:
  push:
    branches: ["main"]
    # A version tag on main, which is what makes a release (D148). The images
    # come out tagged `1.1.0`, `1.1`, `sha-<commit>` and `latest`, and the stack
    # pins the version one so a rollback is editing a line rather than finding a
    # commit.
    tags: ["v*.*.*"]
    # Docs-only pushes should not produce an image. The stack would pull an
    # identical binary under a new tag and call it a deployment.
    #
    # Path filters and tag pushes do not mix reliably — a tag adds no commits
    # for a filter to look at — which is why the `release` trigger below is kept
    # and is the one the runbook uses: `gh release create` fires it with no path
    # filter anywhere near it.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  # A published release, which is how INFRA.md's runbook cuts a version.
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      # The only write this job needs. Deliberately not `packages: write` plus
      # everything else the default token carries.
      packages: write

    strategy:
      # Both images every time, and one failing does not cancel the other: a
      # half-published pair is easier to reason about than a cancelled one.
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: infra/api.Dockerfile
          - name: web
            dockerfile: infra/web.Dockerfile

    steps:
      - uses: actions/checkout@v4

      # GHCR wants a lowercase path and the owner is not. `Vikt` would be
      # rejected at push time, which is a late and confusing place to find out.
      - name: Work out the image name
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "ref=${{ env.REGISTRY }}/${owner}/vikt-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.ref }}
          # Four kinds of tag, and each one is for a different question.
          #
          #   1.1.0        what the stack pins. A rollback is one edit (D148).
          #   1.1          follows the patch releases inside a minor.
          #   sha-<commit> what a `main` build with no version is reachable as.
          #   latest       only from the default branch, and only for a local
          #                `docker run`. Nothing in production pins it.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag

      # What the image should call itself (D151).
      #
      # The tag when there is one, `dev` otherwise. `github.ref_name` is the tag
      # on a tag push and the branch on a branch push, so it is filtered rather
      # than trusted: `main` is not a version.
      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            tag="${{ github.event.release.tag_name }}"
            echo "value=${tag#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # The repo root, because both Dockerfiles copy the workspace.
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # Baked in, so the running container can say what it is without
          # anybody being able to tell it otherwise.
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            APP_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # A registry cache rather than GitHub's, so the layers are reachable
          # from a local `docker build` too when something needs reproducing.
          cache-from: type=registry,ref=${{ steps.image.outputs.ref }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.ref }}:buildcache,mode=max

      # Can anybody actually pull this? (D160)
      #
      # A package on GHCR has its own visibility, separate from the repository's,
      # and it defaults to private. The 1.1.0 deploy found that out at the worst
      # moment: the repository was public, the images were built and pushed, and
      # the stack could not pull them because the packages were still private.
      # Nothing between the push and the deploy had asked the question.
      #
      # So it is asked here, with no credential at all. `docker/login-action`
      # has already authenticated this job, so a plain pull would succeed
      # whatever the visibility is; this deliberately goes around it and talks
      # to the registry the way the Docker host will, with an anonymous token.
      #
      # A private package fails at the token endpoint with 401 rather than at
      # the manifest, so both are checked and either one fails the release.
      - name: Prove the package is anonymously pullable
        run: |
          set -euo pipefail
          ref='${{ steps.image.outputs.ref }}'
          repo="${ref#ghcr.io/}"
          tag='${{ steps.version.outputs.value }}'

          echo "asking GHCR for an anonymous pull token for $repo"
          code=$(curl -s -o /tmp/token.json -w '%{http_code}' \
            "https://ghcr.io/token?scope=repository:${repo}:pull&service=ghcr.io")

          if [ "$code" != "200" ]; then
            echo "::error::$repo is not anonymously pullable: token endpoint returned $code."
            echo "::error::The package is private. Packages, ${repo##*/}, Package settings, Change visibility."
            cat /tmp/token.json || true
            exit 1
          fi

          token=$(jq -r '.token // empty' /tmp/token.json)
          if [ -z "$token" ]; then
            echo "::error::token endpoint returned 200 with no token for $repo"
            exit 1
          fi

          # The manifest itself, with the same Accept set a Docker daemon sends.
          status=$(curl -s -o /tmp/manifest.json -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json' \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
            -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
            -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/${repo}/manifests/${tag}")

          if [ "$status" != "200" ]; then
            echo "::error::anonymous manifest fetch for ${repo}:${tag} returned $status"
            cat /tmp/manifest.json || true
            exit 1
          fi

          if grep -q 'UNAUTHORIZED\|DENIED' /tmp/manifest.json; then
            echo "::error::registry refused the anonymous fetch for ${repo}:${tag}"
            cat /tmp/manifest.json
            exit 1
          fi

          echo "$repo:$tag is anonymously pullable"

      # What to put in the stack. Printed rather than assumed, because the
      # commit tag is the one worth pinning and it is not the one anybody
      # remembers.
      - name: What was published
        run: |
          echo "### \`vikt-${{ matrix.name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
