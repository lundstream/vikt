<!--
  The maskable icon: the same mark on a full-bleed Skymning field.

  Maskable means the OS may crop to a circle, so the mark sits inside the safe
  zone (the middle 80%) and the background runs to the edges. Without the inset
  a launcher would clip the end dot off the curve, which is the one part of the
  mark that has to survive.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <rect width="48" height="48" fill="#16232B"/>
  <g transform="translate(24 24) scale(0.72) translate(-24 -24)">
  <path d="M10 15 C 22 15, 26 33, 38 33" fill="none" stroke="#E0455F" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="38" cy="33" r="5" fill="#E0455F"/>
  </g>
</svg>
