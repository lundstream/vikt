# The production stack, for Portainer.
#
# Same three services as `docker-compose.yml` and the same network shape. The
# one difference is that this **pulls images** instead of building them, because
# a Portainer host has no source tree and should not be compiling anything: a
# stack that builds from git turns every redeploy into a pnpm install on a box
# that is meant to be running things.
#
# Everything configurable is a stack environment variable, because that is the
# form Portainer gives you: paste this file into a stack, fill the variables in
# the panel underneath, deploy. Nothing here reads a `.env` file, since there is
# no filesystem beside the compose file to read one from.
#
# Fill in the variables in the panel underneath the editor. CONTACT_EMAIL is
# required wherever LANDING_ENABLED is true: the privacy page has to name
# somebody the reader can write to, and the API refuses to boot without it.
#
# **Every variable the API's env schema knows is listed below, even the ones
# almost nobody sets** (D147). A variable set in the Portainer panel that this
# file does not forward is silently absent in the container: no boot failure, no
# warning, the schema's default takes over, and the panel still shows the value
# that was typed. `apps/api/test/stack-variables.test.ts` walks the schema and
# fails if one is missing here or undocumented in `infra/.env.example`.

name: vikt

services:
  postgres:
    # Pinned by digest, not by tag (D138). Postgres 16 keeps arriving under
    # the same name; a database that upgrades itself because a tag moved is
    # not something to find out about during a restore.
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      # A named volume, so Portainer's "remove stack" does not take the data
      # with it and a `docker volume ls` shows what is being kept.
      - vikt_pgdata:/var/lib/postgresql/data
    networks:
      # `backend` only: the database has no route off the host.
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    # Pinned to a version, never to `latest` (D148).
    #
    # `IMAGE_TAG` is the one line a rollback edits: set it to the previous
    # version, redeploy, done. It holds whatever kind of tag you want to pin —
    # `1.1.0`, `1.1`, or `sha-<commit>` for something that was never released —
    # because they all live in the same namespace on the registry.
    #
    # No default on purpose. `latest` as a fallback means a redeploy pulls
    # whatever main happened to be when nobody was looking, and a stack that
    # cannot say which version it is running cannot be rolled back to a known
    # one either.
    #
    # `IMAGE_REPO` is where the image comes from, and it exists because this
    # installation has deployed both ways (D120, D156). The default is the
    # registry, which is what `release.yml` publishes to and what a normal
    # deploy pulls. Setting it to `local/` instead means the images were built
    # on the workstation and loaded onto the host, which is how production got
    # here and is the fallback whenever the registry is not an option.
    #
    # It is a prefix rather than a flag so the two paths differ in one string
    # and nothing else: same tag, same variables, same file. The alternative
    # was a second compose file for local deploys, which is how the deployed
    # stack came to be a different file from the one in the repository.
    image: ${IMAGE_REPO:-ghcr.io/lundstream/}vikt-api:${IMAGE_TAG:?set IMAGE_TAG, e.g. 1.1.0}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_NAME: ${APP_NAME:-Vikt}
      LANDING_ENABLED: ${LANDING_ENABLED:-false}
      REQUEST_ENABLED: ${REQUEST_ENABLED:-false}
      # The API reads this too, not just nginx (D157). `assertProdSecrets`
      # refuses to boot when either flag above is true and this is empty,
      # because /integritet has to name someone the reader can write to.
      # Forwarded to nginx as well, further down, where it is substituted
      # into the built page (D121).
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      # Where recipients will click. Every link in every email is built from it,
      # and in production the API refuses to boot on a localhost or private
      # address, because "absolute" was not enough (D109, D113).
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
      # Reads and writes the encrypted mail password and the backups (D102).
      # Without it the app runs and cannot store an SMTP password.
      SECRET_KEY: ${SECRET_KEY:-}
      HOST: 0.0.0.0
      PORT: 3000
      # The immediate peer allowed to speak for a client: the `edge` subnet,
      # pinned below. NOT a hop count (D14). Verify from a cellular IP.
      TRUST_PROXY: ${TRUST_PROXY:-172.31.240.0/24}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Same-origin in this stack, since nginx proxies /api/. A comma-separated
      # list only where something else has to reach the API directly.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SYSTEM_INTAKE_FLOOR_KCAL: ${SYSTEM_INTAKE_FLOOR_KCAL:-1200}
      # On by default: the alternative was a separate process nobody ran and a
      # queue that sat still while every visible signal said mail worked (D104).
      MAIL_WORKER_IN_PROCESS: ${MAIL_WORKER_IN_PROCESS:-true}

      # Web push (D136). All three empty means the reminders do not exist at
      # all: nothing is scheduled, no endpoint is registered, and the section in
      # Inställningar is not drawn. Half-configured is refused at boot, because
      # a public key with no private one produces subscriptions nothing can ever
      # send to and no error anywhere.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}

      # Read **once**, on first boot, and imported into the encrypted settings
      # table (D102). Mail is configured in Administration, Mejlserver after
      # that, and these can be emptied again. Leave them empty on a new install.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Vikt <noreply@localhost>}
      SMTP_SECURE: ${SMTP_SECURE:-false}

      # The optional LLM layer (§6 phase 8). `OLLAMA_URL` empty means every
      # surface it backs is absent rather than greyed out, which is the whole
      # design: the workstation it talks to is not always on.
      LLM_ENABLED: ${LLM_ENABLED:-false}
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL_SMALL: ${OLLAMA_MODEL_SMALL:-gemma4:e4b}
      OLLAMA_MODEL_LARGE: ${OLLAMA_MODEL_LARGE:-qwen3.6:27b}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-20000}
      OLLAMA_JOB_TIMEOUT_MS: ${OLLAMA_JOB_TIMEOUT_MS:-180000}
      # Photographs of food (D143). No default model name on purpose: a tag that
      # reports a vision capability is not a tag that looks at images, and the
      # API proves it at boot before offering the surface.
      LLM_VISION_MODEL: ${LLM_VISION_MODEL:-}
      OLLAMA_VISION_TIMEOUT_MS: ${OLLAMA_VISION_TIMEOUT_MS:-60000}
    volumes:
      # Where the scheduled backup writes (D103, D168): a directory on the host,
      # bound in at /backups. Choose /backups under Administration, Backup.
      #
      # A bind mount, not the named volume this used to be. The API runs as uid
      # 1000, a named volume's mountpoint belongs to root, and a path that is
      # not mounted at all, such as /var/backups/vikt, is inside the container
      # and not writable either: production's nightly backup failed with EACCES
      # on exactly that. The host directory is created and handed to uid 1000
      # before the stack starts (INFRA.md), and it outlives the container.
      - ${BACKUP_HOST_DIR:?set BACKUP_HOST_DIR to a host directory owned by uid 1000, e.g. /var/backups/vikt/app}:/backups
    networks:
      - backend
      # `edge` so nginx can reach it, and so the food-database lookups have
      # outbound internet. Still no published ports.
      - edge
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  nginx:
    # The same tag and the same source as the API, always. See above.
    image: ${IMAGE_REPO:-ghcr.io/lundstream/}vikt-web:${IMAGE_TAG:?set IMAGE_TAG, e.g. 1.1.0}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      # Substituted into the built index.html and manifest at container start,
      # so renaming the app needs no rebuild (D13).
      APP_NAME: ${APP_NAME:-Vikt}
      LANDING_ENABLED: ${LANDING_ENABLED:-false}
      REQUEST_ENABLED: ${REQUEST_ENABLED:-false}
      # Who runs this installation (D121). The GDPR controller is whoever
      # deploys Vikt, so these are settings and not constants in the source.
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      OPERATOR: ${OPERATOR:-}
      REPO_URL: ${REPO_URL:-https://github.com/lundstream/vikt}
      SUPPORT_URL: ${SUPPORT_URL:-}
    ports:
      # `WEB_BIND` is the one line to get right, and it depends on where the
      # reverse proxy is:
      #
      #  - **Nginx Proxy Manager in a container on this host**: leave the bind
      #    at 127.0.0.1 and put this service on NPM's network instead (see the
      #    commented block below), then point NPM at `http://vikt-nginx:80`. A
      #    container cannot reach the host's loopback, so a proxy container and
      #    a loopback bind is the combination that looks right and refuses every
      #    request.
      #  - **A proxy elsewhere on the LAN**: set WEB_BIND to 0.0.0.0 and let the
      #    host firewall decide who may reach it. Do not skip the firewall: this
      #    port answers without TLS and without the forwarded-header validation
      #    that only happens behind the proxy.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    networks:
      - edge
      # Uncomment, along with the `npm` network at the bottom, when the reverse
      # proxy is a container on this host. Then NPM reaches this by name and
      # nothing needs publishing at all.
      # - npm

networks:
  # Postgres and the API. No gateway, so nothing here can reach the internet
  # and nothing on the internet can reach it.
  backend:
    internal: true
  # nginx and the API. The subnet is pinned so TRUST_PROXY can name the peer
  # exactly rather than trusting every private address. Change both together.
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.31.240.0/24}
  # The reverse proxy's own network, created outside this stack. Uncomment with
  # the service entry above, and set NPM_NETWORK to its real name.
  # npm:
  #   external: true
  #   name: ${NPM_NETWORK:-npm_default}

volumes:
  vikt_pgdata:
