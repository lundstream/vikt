# Serves the built web dist and proxies /api to the Fastify container.
#
# Same origin for both, which is what lets the session cookie be SameSite=Lax
# with no CORS anywhere. TLS is terminated upstream by Nginx Proxy Manager;
# this server block speaks plain HTTP on the internal network only.

upstream vikt_api {
    server api:3000;
    keepalive 16;
}

# Set from LANDING_ENABLED at container start; see 31-modes.sh.
map $host $landing_enabled {
    default "__LANDING_ENABLED__";
}

# Set from REQUEST_ENABLED the same way (D127). Separate from the landing page
# on purpose: serving a page to read and accepting a stranger's name and
# address are different decisions.
map $host $request_enabled {
    default "__REQUEST_ENABLED__";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nothing here is big. Photos in phase 7 will need this raised.
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    location /api/ {
        # ------------------------------------------------------------------
        # REQUIRED IN PRODUCTION: restrict this to Cloudflare's ranges.
        #
        # The API attributes every request to CF-Connecting-IP, and trusts that
        # header because only Cloudflare sets it. That guarantee is worth
        # exactly as much as the guarantee that nothing reaches nginx except
        # through Cloudflare. If this server block is reachable directly, a
        # client can send its own CF-Connecting-IP and be believed — see
        # DECISIONS.md D14.
        #
        # Uncomment and fill from https://www.cloudflare.com/ips/ (both the
        # IPv4 and IPv6 lists; they change, so re-check them when you touch
        # this file). Nginx Proxy Manager sits between, so these are the
        # addresses NPM forwards from, not Cloudflare's directly — put the
        # allow-list on whichever hop actually faces the internet.
        #
        #   allow 173.245.48.0/20;
        #   allow 103.21.244.0/22;
        #   ... the rest of the published list ...
        #   deny  all;
        # ------------------------------------------------------------------

        proxy_pass http://vikt_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Passed through unchanged. The API reads it only when the peer address
        # matches TRUST_PROXY, so it is inert on a direct connection to the API
        # but NOT inert on a direct connection to this nginx — hence the block
        # above.
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 30s;
    }

    # Hashed assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Both index files carry the app name, substituted at container start, so
    # neither may be cached by the browser.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /app/index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /app/manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # The service worker is scoped to /app/ and must never be cached: a stale
    # worker is a stale app that cannot be updated (D90).
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # The app (D90). Every client-side route under /app/ falls back to the
    # app's own shell, never to the landing page.
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # /app with no trailing slash is the app, not a 404.
    location = /app {
        return 301 /app/;
    }

    # The landing page, when this installation has one (D94).
    #
    # `LANDING_ENABLED` is substituted at container start into
    # $landing_enabled by 31-modes.sh, the same mechanism the app name uses.
    # Off, the root redirects to the app and the landing bundle is never
    # served — a private install has no public face, rather than a public face
    # nobody links to.
    #
    # A single static page either way: no SPA fallback here, so an unknown path
    # under the root is a 404 rather than the landing page pretending every URL
    # exists.
    location = / {
        if ($landing_enabled = "false") {
            return 302 /app/;
        }
        try_files /index.html =404;
    }

    # The two public text pages (D106). Same bundle as the landing page, which
    # switches on the path: they are not an SPA and there is no fallback here,
    # so an unknown path is still a 404 rather than the landing page pretending
    # every URL exists.
    location = /integritet {
        try_files /index.html =404;
    }

    location = /villkor {
        try_files /index.html =404;
    }

    # Asking for an invite code (D127). Unlinked from everywhere, and absent
    # unless REQUEST_ENABLED is on: 404, not a page that says no. The API does
    # not register the endpoint either, so this is the second of two locks
    # rather than the only one.
    location = /kod {
        if ($request_enabled = "false") {
            return 404;
        }
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
